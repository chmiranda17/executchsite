<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Executch</title>
    <link rel="icon" href="/global/assets/brand/executch/icons/favicon-adaptive.svg">
    <link rel="stylesheet" href="/global/css/fonts.css">
    <link rel="stylesheet" href="/global/css/style.css">
</head>
<body class="login-body login-access">
    <main class="login-shell">
        <div class="login-showcase" aria-hidden="true"></div>
        <section class="login-panel" aria-labelledby="login-titulo">
            <div class="brand-login">
                <img src="/global/assets/brand/executch/logos/executch-logo-header-ultrarealistic.png"
                     alt="Executch" class="brand-login__logo">
            </div>
            <div class="login-form-heading login-access-heading">
                <h1 id="login-titulo" class="login-title">Acesse sua conta</h1>
                                    <p class="login-copy">Prévia da tela de login. Para entrar, use o endereço do Executch fornecido pelo seu escritório.</p>
                            </div>
            <div class="form-grid login-access-form">
                                    <div class="field">
                        <label for="email">E-mail</label>
                        <input id="email" type="email" disabled>
                    </div>
                    <div class="field">
                        <label for="senha">Senha</label>
                        <input id="senha" type="password" disabled>
                    </div>
                    <div class="form-actions"><button type="button" disabled>Entrar</button></div>
                            </div>
            <p class="login-access-about"><a class="login-inline-link" href="/">Conheça o Executch</a></p>
        </section>
    </main>
</body>
</html>
